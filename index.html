<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>材料样板管理系统</title>
    <link rel="icon" type="image/jpeg" href="src/icon/logo.jpg" />
    <link rel="stylesheet" href="src/css/style.css?v=20260624" />
    <link rel="stylesheet" href="src/css/sidebar.css?v=29" />
    <link rel="stylesheet" href="src/css/dashboard.css?v=108" />
    <link rel="stylesheet" href="src/css/easycod.css" />
    <link
      rel="stylesheet"
      href="src/icon/phosphor-icons.css"
      media="print"
      onload="this.media = 'all'"
    />
  </head>
  <body>
    <div id="toastContainer" class="toast-container"></div>

    <!-- ===== 全局加载遮罩 (用于退出登录等场景) ===== -->
    <div id="globalLoading" class="global-loading">
      <div class="global-loading-backdrop"></div>
      <div class="global-loading-content">
        <div class="spinner"></div>
        <span>退出中...</span>
      </div>
    </div>

    <!-- ===== LOGIN ===== -->
    <div id="loginSection" class="page-section active">
      <div class="login-page">
        <div class="login-card">
          <h1>EeaySamplistCod</h1>
          <form id="loginForm">
            <div class="form-group">
              <input
                type="email"
                id="loginEmail"
                placeholder="Email"
                autocomplete="email"
              />
            </div>
            <div class="form-group">
              <input
                type="password"
                id="loginPassword"
                placeholder="Password"
                autocomplete="current-password"
              />
            </div>
            <button type="submit" class="btn btn-primary btn-block">
              Login
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- ===== APP (main application) ===== -->
    <div id="appSection" class="page-section">
      <main class="main-content">
        <div class="container">
          <!-- ===== 标签打印 (Labels) ===== -->
          <div id="labelsSection" class="page-section">
            <div class="print-toolbar">
              <div>
                <button class="back-btn" id="backFromLabels">← 返回</button>
                <h2 style="font-size: 1.1rem; margin-top: 8px">标签打印</h2>
              </div>
              <button class="btn btn-primary" onclick="window.print()">
                打印全部标签
              </button>
            </div>
            <div id="labelsContainer" class="print-labels-container"></div>
          </div>

          <!-- ===== 样板详情 (Sample Detail) ===== -->
          <div id="sampleDetailSection" class="page-section">
            <div class="detail-tab-header">
              <div class="section-header">
                <button class="back-btn" id="backFromDetail">← 返回</button>
              </div>
            </div>
            <div id="sampleDetailContainer"></div>
          </div>
        </div>
      </main>
    </div>

    <!-- 删除确认弹窗 -->
    <div class="modal-overlay" id="deleteConfirmModal">
      <div class="modal" style="max-width: 400px">
        <div class="modal-header">
          <h3>确认删除</h3>
          <button class="modal-close">&times;</button>
        </div>
        <div class="modal-body">
          <p
            id="deleteConfirmInfo"
            style="
              margin-bottom: 12px;
              font-size: 0.85rem;
              color: var(--text-secondary);
            "
          ></p>
          <div class="form-group">
            <input
              type="password"
              id="deletePasswordInput"
              placeholder="请输入登录密码确认"
              style="width: 100%"
            />
          </div>
          <div
            id="deletePasswordError"
            style="
              color: var(--danger);
              font-size: 0.78rem;
              display: none;
              margin-top: 4px;
            "
          >
            密码错误，删除已取消
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" id="cancelDeleteBtn" class="btn btn-secondary">
            取消
          </button>
          <button
            type="button"
            id="confirmDeleteBtn"
            class="btn btn-primary"
            style="background: var(--danger)"
          >
            确认删除
          </button>
        </div>
      </div>
    </div>

    <!-- 详情弹窗 -->
    <!-- ===== 详情弹窗 ===== -->
    <div class="modal-overlay" id="detailModal">
      <div class="modal" style="max-width: 560px">
        <div class="modal-header">
          <h3 id="detailModalTitle">详情</h3>
          <button class="modal-close">&times;</button>
        </div>
        <div class="modal-body" id="detailModalBody"></div>
        <div class="modal-footer" id="detailModalFooter">
          <button type="button" class="btn btn-secondary modal-close">
            关闭
          </button>
        </div>
      </div>
    </div>
  </body>
  <script src="src/lib/supabase.min.js"></script>
  <script src="src/lib/qrcode.min.js"></script>
  <script src="src/lib/pinyin-pro.min.js"></script>
  <script src="src/js/login.js?v=2"></script>
  <script src="src/js/dashboard.js"></script>
  <script src="src/js/sidebar.js"></script>
  <script src="src/js/app/db-writer.js?v=2"></script>
  <script src="src/js/app/upload-manager.js?v=2"></script>
  <script src="src/js/app/easycod-renderer.js?v=1"></script>
  <script src="src/js/easycod.js?v=3"></script>
  <script src="src/js/easyvoice.js"></script>
  <script src="src/js/easyorder-and-proc.js?v=20260623k"></script>
  <script src="src/js/app.js?v=21"></script>
</html>
