<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>材料样板管理系统</title>
    <link rel="icon" type="image/jpeg" href="src/icon/logo.jpg" />
    <link rel="stylesheet" href="src/css/style.css?v=11" />
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  </head>
  <body>
    <div id="toastContainer" class="toast-container"></div>

    <div id="loginSection" class="page-section active">
      <div class="login-page">
        <div class="login-card">
          <h1>EeaySamplistCod</h1>

          <form id="loginForm">
            <div class="form-group">
              <input
                type="email"
                id="loginEmail"
                placeholder="Email"
                autocomplete="email"
              />
            </div>
            <div class="form-group">
              <input
                type="password"
                id="loginPassword"
                placeholder="Password"
                autocomplete="current-password"
              />
            </div>
            <button type="submit" class="btn btn-primary btn-block">
              Login
            </button>
          </form>
        </div>
      </div>
    </div>

    <div id="appSection" class="page-section">
      <aside class="sidebar collapsed" id="sidebar">
        <div class="sidebar-top-group">
          <div class="sidebar-header">
            <div
              class="sidebar-logo"
              onclick="
                window.app.showView('dashboard');
                window.app.renderDashboard();
              "
            >
              <i class="ph ph-command sidebar-logo-icon"></i>
              <span class="sidebar-title-text">EasySoft</span>
            </div>
            <button
              class="sidebar-toggle"
              id="sidebarToggle"
              title="折叠侧边栏"
            >
              <i class="ph ph-sidebar-simple toggle-icon"></i>
            </button>
          </div>
          <div class="nav-separator"></div>
          <span class="sidebar-user" id="sidebarUser">
            <i class="ph ph-user-circle sidebar-user-icon"></i>
            <span class="sidebar-user-name"></span>
          </span>
          <div class="nav-separator"></div>
        </div>
        <nav class="sidebar-nav">
          <div class="sidebar-nav-scroll">
            <!-- EasyCod -->
            <div class="nav-group">
              <button class="nav-group-header" data-group="easycod">
                <span class="nav-group-label nav-group-label-expanded"
                  >EasyCod</span
                >
                <span class="nav-group-label nav-group-label-collapsed"
                  >Code</span
                >
                <i class="ph ph-caret-down group-arrow"></i>
              </button>
              <div class="nav-group-body" id="group-easycod">
                <button id="navProjects" class="sidebar-link active">
                  <span class="nav-link-text">样板类别</span>
                  <i class="ph ph-list"></i>
                </button>
                <button id="infoBtn" class="sidebar-link">
                  <span class="nav-link-text">信息控制</span>
                  <i class="ph ph-contrast"></i>
                </button>
              </div>
            </div>

            <div class="nav-separator"></div>

            <!-- EasyOrder -->
            <div class="nav-group">
              <button class="nav-group-header" data-group="easyorder">
                <span class="nav-group-label nav-group-label-expanded"
                  >EasyOrder</span
                >
                <span class="nav-group-label nav-group-label-collapsed"
                  >Order</span
                >
                <i class="ph ph-caret-down group-arrow"></i>
              </button>
              <div class="nav-group-body" id="group-easyorder">
                <button id="navOrders" class="sidebar-link">
                  <span class="nav-link-text">订单信息</span>
                  <i class="ph ph-list-numbers"></i>
                </button>
                <button id="navApply" class="sidebar-link">
                  <span class="nav-link-text">申请汇总</span>
                  <i class="ph ph-git-pull-request"></i>
                </button>
                <button id="navClock" class="sidebar-link">
                  <span class="nav-link-text">打卡管理</span>
                  <i class="ph ph-file-text"></i>
                </button>
                <button id="navSettings" class="sidebar-link">
                  <span class="nav-link-text">相关设置</span>
                  <i class="ph ph-gear"></i>
                </button>
              </div>
            </div>

            <div class="nav-separator"></div>

            <!-- EasyProc -->
            <div class="nav-group">
              <button class="nav-group-header" data-group="easyproc">
                <span class="nav-group-label nav-group-label-expanded"
                  >EasyProc</span
                >
                <span class="nav-group-label nav-group-label-collapsed"
                  >Proc</span
                >
                <i class="ph ph-caret-down group-arrow"></i>
              </button>
              <div class="nav-group-body" id="group-easyproc">
                <button id="navApprovalUsers" class="sidebar-link">
                  <span class="nav-link-text">账号权限</span>
                  <i class="ph ph-person"></i>
                </button>
                <button id="navWorkflows" class="sidebar-link">
                  <span class="nav-link-text">流程汇总</span>
                  <i class="ph ph-table"></i>
                </button>
                <button id="navApprovalRecords" class="sidebar-link">
                  <span class="nav-link-text">审批记录</span>
                  <i class="ph ph-bell-ringing nav-icon-alert"></i>
                </button>
              </div>
            </div>

            <div class="nav-separator"></div>

            <!-- EasyVoic -->
            <div class="nav-group">
              <button class="nav-group-header" data-group="easyvoic">
                <span class="nav-group-label nav-group-label-expanded"
                  >EasyVoic</span
                >
                <span class="nav-group-label nav-group-label-collapsed"
                  >Voice</span
                >
                <i class="ph ph-caret-down group-arrow"></i>
              </button>
              <div class="nav-group-body" id="group-easyvoic">
                <button id="navVoiceAssistant" class="sidebar-link">
                  <span class="nav-link-text">语音助手</span>
                  <i class="ph ph-archive"></i>
                </button>
              </div>
            </div>

            <div class="nav-separator"></div>

            <!-- EasyPdf -->
            <div class="nav-group">
              <button class="nav-group-header" data-group="easypdf">
                <span class="nav-group-label nav-group-label-expanded"
                  >EasyPdf</span
                >
                <span class="nav-group-label nav-group-label-collapsed"
                  >Pdf</span
                >
                <i class="ph ph-caret-down group-arrow"></i>
              </button>
              <div class="nav-group-body" id="group-easypdf">
                <button id="navDocStore" class="sidebar-link">
                  <span class="nav-link-text">文档存储</span>
                  <i class="ph ph-laptop"></i>
                </button>
              </div>
            </div>
          </div>

          <div class="sidebar-nav-bottom">
            <div class="nav-separator"></div>

            <button
              id="navBottomSettings"
              class="sidebar-link sidebar-settings"
            >
              <span class="nav-link-text">设置</span>
              <i class="ph ph-gear"></i>
            </button>

            <div class="nav-separator"></div>

            <button id="logoutBtn" class="sidebar-link sidebar-logout">
              <span class="nav-link-text">退出</span>
              <i class="ph ph-sign-out"></i>
            </button>
          </div>
        </nav>
      </aside>

      <main class="main-content">
        <div class="container">
          <div id="dashboardSection" class="page-section">
            <div class="section-header">
              <h2>仪表盘</h2>
            </div>
            <div id="dashboardContainer"></div>
          </div>

          <div id="projectsSection" class="page-section">
            <div class="section-header">
              <h2>类别</h2>
              <button id="projectRefreshBtn" class="toolbar-btn btn-secondary">
                ⟳ 刷新
              </button>
            </div>
            <div class="table-filters" id="projectFilters">
              <input
                type="text"
                id="projectSearchInput"
                placeholder="🔍 搜索编号/品名/品牌..."
                class="toolbar-input"
                style="width: 100px"
              />
              <select
                id="projectBrandFilter"
                class="toolbar-select"
                style="width: 100px"
              >
                <option value="">全部品牌</option>
              </select>
              <select
                id="projectCategoryFilter"
                class="toolbar-select"
                style="width: 100px"
              >
                <option value="">所属类别</option>
              </select>
              <select
                id="projectProcFilter"
                class="toolbar-select"
                style="width: 100px"
              >
                <option value="">是否集采</option>
                <option value="集采">集采</option>
                <option value="非集采">非集采</option>
              </select>
              <select
                id="projectRangeFilter"
                class="toolbar-select"
                style="width: 100px"
              >
                <option value="">集采范围</option>
                <option value="范围内">范围内</option>
                <option value="范围外">范围外</option>
              </select>
              <button id="projectQueryBtn" class="toolbar-btn btn-secondary">
                查询
              </button>
              <span style="flex: 1"></span>
              <div class="view-toggle" id="projectViewToggle">
                <button class="toggle-btn active" data-view="cards">
                  📇 卡片
                </button>
                <button class="toggle-btn" data-view="table">📋 列表</button>
              </div>
              <button id="createProjectBtn" class="toolbar-btn btn-primary">
                + 新建类别
              </button>
            </div>
            <div id="projectsContainer" class="card-grid"></div>
          </div>

          <div id="samplesSection" class="page-section">
            <div class="section-header">
              <h2 id="currentProjectName"></h2>
              <button class="back-btn" id="backToProjects">← 返回类别</button>
            </div>
            <div class="table-filters" id="sampleFilters">
              <input
                type="text"
                id="sampleBrandFilter"
                placeholder="🔍 编号/名称/型号/范围..."
                autocomplete="off"
                class="toolbar-input"
                style="width: 140px"
              />
              <span style="flex: 1"></span>
              <div class="btn-group">
                <button id="selectAllBtn" class="toolbar-btn btn-secondary">
                  全选
                </button>
                <button
                  id="batchPrintBtn"
                  class="toolbar-btn btn-secondary"
                  disabled
                >
                  批量打印
                </button>
                <button
                  id="editProjectSampleBtn"
                  class="toolbar-btn btn-secondary"
                >
                  编辑类别
                </button>
                <button id="createSampleBtn" class="toolbar-btn btn-primary">
                  + 录入样板
                </button>
              </div>
            </div>
            <div id="samplesContainer" class="sample-grid"></div>
          </div>

          <div id="labelsSection" class="page-section">
            <div class="print-toolbar">
              <div>
                <button class="back-btn" id="backFromLabels">← 返回</button>
                <h2 style="font-size: 1.1rem; margin-top: 8px">标签打印</h2>
              </div>
              <button class="btn btn-primary" onclick="window.print()">
                打印全部标签
              </button>
            </div>
            <div id="labelsContainer" class="print-labels-container"></div>
          </div>

          <div id="sampleDetailSection" class="page-section">
            <div class="section-header">
              <button class="back-btn" id="backFromDetail">← 返回</button>
            </div>
            <div id="sampleDetailContainer"></div>
          </div>

          <div id="infoSection" class="page-section">
            <div class="section-header">
              <h2>信息</h2>
            </div>
            <div id="infoContainer"></div>
          </div>

          <div id="ordersSection" class="page-section">
            <div class="section-header">
              <h2>订单管理</h2>
              <button id="refreshOrdersBtn" class="toolbar-btn btn-secondary">
                ⟳ 刷新
              </button>
            </div>
            <div class="table-filters">
              <input
                type="text"
                id="orderSearchInput"
                placeholder="订单号"
                autocomplete="off"
                class="toolbar-input"
                style="width: 100px"
              />
              <select
                id="orderStatusFilter"
                class="toolbar-select"
                style="width: 100px"
              >
                <option value="">全部状态</option>
                <option value="未提交">未提交</option>
                <option value="已收录">已收录</option>
              </select>
              <input
                type="date"
                id="orderDateStart"
                class="toolbar-date"
                style="width: 100px"
              />
              <input
                type="date"
                id="orderDateEnd"
                class="toolbar-date"
                style="width: 100px"
              />
              <button id="orderQueryBtn" class="toolbar-btn btn-secondary">
                查询
              </button>
              <span style="flex: 1"></span>
              <button id="createOrderBtn" class="toolbar-btn btn-primary">
                + 录入
              </button>
              <button id="selectAllOrders" class="toolbar-btn btn-secondary">
                全选
              </button>
              <button id="batchDeleteOrdersBtn" class="toolbar-btn btn-danger">
                批量删除
              </button>
            </div>
            <div id="ordersContainer"></div>
          </div>

          <div id="applySection" class="page-section">
            <div class="section-header">
              <h2>申请管理</h2>
              <button id="refreshApplyBtn" class="toolbar-btn btn-secondary">
                ⟳ 刷新
              </button>
            </div>
            <div class="table-filters">
              <input
                type="text"
                id="applySearchInput"
                placeholder="申请人"
                autocomplete="off"
                class="toolbar-input"
                style="width: 100px"
              />
              <select
                id="applyTypeFilter"
                class="toolbar-select"
                style="width: 100px"
              >
                <option value="">全部事由</option>
                <option value="运输">运输</option>
                <option value="参观">参观</option>
                <option value="选样">选样</option>
                <option value="借还">借还</option>
                <option value="其他">其他</option>
              </select>
              <select
                id="applyStatusFilter"
                class="toolbar-select"
                style="width: 100px"
              >
                <option value="">全部状态</option>
                <option value="待审核">待审核</option>
                <option value="已收录">已收录</option>
              </select>
              <input
                type="date"
                id="applyDateStart"
                class="toolbar-date"
                style="width: 100px"
              />
              <input
                type="date"
                id="applyDateEnd"
                class="toolbar-date"
                style="width: 100px"
              />
              <button id="applyQueryBtn" class="toolbar-btn btn-secondary">
                查询
              </button>
              <span style="flex: 1"></span>
              <button id="createApplyBtn" class="toolbar-btn btn-primary">
                + 录入
              </button>
              <button id="selectAllApply" class="toolbar-btn btn-secondary">
                全选
              </button>
              <button id="batchDeleteApplyBtn" class="toolbar-btn btn-danger">
                批量删除
              </button>
            </div>
            <div id="applyContainer"></div>
          </div>

          <div id="clockSection" class="page-section">
            <div class="section-header">
              <h2>打卡管理</h2>
              <button id="refreshClockBtn" class="toolbar-btn btn-secondary">
                ⟳ 刷新
              </button>
            </div>
            <div class="table-filters">
              <input
                type="text"
                id="clockSearchInput"
                placeholder="姓名"
                autocomplete="off"
                class="toolbar-input"
                style="width: 100px"
              />
              <select
                id="clockCompanyTypeFilter"
                class="toolbar-select"
                style="width: 100px"
              >
                <option value="">全部类型</option>
                <option value="业主方">业主方</option>
                <option value="运营方">运营方</option>
                <option value="品牌方">品牌方</option>
                <option value="其他">其他</option>
              </select>
              <input
                type="date"
                id="clockDateStart"
                class="toolbar-date"
                style="width: 100px"
              />
              <input
                type="date"
                id="clockDateEnd"
                class="toolbar-date"
                style="width: 100px"
              />
              <button id="clockQueryBtn" class="toolbar-btn btn-secondary">
                查询
              </button>
              <span style="flex: 1"></span>
              <button id="createClockBtn" class="toolbar-btn btn-primary">
                + 录入
              </button>
              <button id="selectAllClock" class="toolbar-btn btn-secondary">
                全选
              </button>
              <button id="batchDeleteClockBtn" class="toolbar-btn btn-danger">
                批量删除
              </button>
            </div>
            <div id="clockContainer"></div>
          </div>

          <!-- 审批人管理 -->
          <div id="approvalUsersSection" class="page-section">
            <div class="section-header">
              <h2>审批人管理</h2>
              <button
                id="refreshApprovalUsersBtn"
                class="toolbar-btn btn-secondary"
              >
                ⟳ 刷新
              </button>
            </div>
            <div style="margin-bottom: 12px">
              <button id="addApprovalUserBtn" class="toolbar-btn btn-primary">
                + 添加审批人
              </button>
            </div>
            <div id="approvalUsersContainer"></div>
          </div>

          <!-- 流程编辑 -->
          <div id="workflowSection" class="page-section">
            <div class="section-header">
              <h2>流程编辑</h2>
              <button
                id="refreshWorkflowsBtn"
                class="toolbar-btn btn-secondary"
              >
                ⟳ 刷新
              </button>
            </div>
            <div id="workflowContainer"></div>
          </div>

          <!-- 审批记录 -->
          <div id="approvalRecordsSection" class="page-section">
            <div class="section-header">
              <h2>审批记录</h2>
              <button
                id="refreshApprovalRecordsBtn"
                class="toolbar-btn btn-secondary"
              >
                ⟳ 刷新
              </button>
            </div>
            <div id="approvalRecordsContainer"></div>
          </div>

          <!-- 语音助手管理 - 依维五库 -->
          <div id="voiceAssistantSection" class="page-section">
            <div class="section-header">
              <h2>语音助手 · 依维（Evi）</h2>
            </div>
            <div
              class="table-filters"
              style="gap: 4px; margin-bottom: 16px; flex-wrap: wrap"
            >
              <button
                id="vaTabKnowledge"
                class="toolbar-btn btn-primary"
                style="border-radius: 3px"
              >
                📚 知识库
              </button>
              <button
                id="vaTabPersonality"
                class="toolbar-btn btn-secondary"
                style="border-radius: 3px"
              >
                🪪 人格库(E)
              </button>
              <button
                id="vaTabBehavior"
                class="toolbar-btn btn-secondary"
                style="border-radius: 3px"
              >
                🛡️ 行为库(E)
              </button>
              <button
                id="vaTabVerification"
                class="toolbar-btn btn-secondary"
                style="border-radius: 3px"
              >
                🔍 核验层(E)
              </button>
              <button
                id="vaTabPrecipRules"
                class="toolbar-btn btn-secondary"
                style="border-radius: 3px"
              >
                📐 沉淀规则(E)
              </button>
              <button
                id="vaTabMemory"
                class="toolbar-btn btn-secondary"
                style="border-radius: 3px"
              >
                🧠 记忆库
              </button>
              <button
                id="vaTabErrors"
                class="toolbar-btn btn-secondary"
                style="border-radius: 3px"
              >
                ❌ 错误库
              </button>
              <button
                id="vaTabEmotion"
                class="toolbar-btn btn-secondary"
                style="border-radius: 3px"
              >
                💗 情感趋势
              </button>
              <button
                id="vaTabLogs"
                class="toolbar-btn btn-secondary"
                style="border-radius: 3px"
              >
                📋 对话日志
              </button>
              <button
                id="vaTabFunctions"
                class="toolbar-btn btn-secondary"
                style="border-radius: 3px"
              >
                ⚙️ 函数技能(E)
              </button>
              <button
                id="vaTabInstincts"
                class="toolbar-btn btn-secondary"
                style="border-radius: 3px"
              >
                ⚡ 本能库(E)
              </button>
              <span style="flex: 1"></span>
              <button
                id="vaDailySummary"
                class="toolbar-btn btn-secondary"
                style="border-radius: 3px"
              >
                🌅 每日沉淀
              </button>
              <button id="vaRefreshBtn" class="toolbar-btn btn-secondary">
                ⟳ 刷新
              </button>
            </div>
            <div id="vaKnowledgeContainer"></div>
            <div id="vaPersonalityContainer" style="display: none"></div>
            <div id="vaBehaviorContainer" style="display: none"></div>
            <div id="vaVerificationContainer" style="display: none"></div>
            <div id="vaPrecipRulesContainer" style="display: none"></div>
            <div id="vaMemoryContainer" style="display: none"></div>
            <div id="vaErrorsContainer" style="display: none"></div>
            <div id="vaEmotionContainer" style="display: none"></div>
            <div id="vaLogsContainer" style="display: none"></div>
            <div id="vaFunctionsContainer" style="display: none"></div>
            <div id="vaInstinctsContainer" style="display: none"></div>
          </div>
        </div>
      </main>
    </div>

    <div class="modal-overlay" id="projectModal">
      <div class="modal">
        <div class="modal-header">
          <h3 id="projectModalTitle">新建类别</h3>
          <button class="modal-close">&times;</button>
        </div>
        <form id="projectForm">
          <div class="modal-body">
            <input type="hidden" id="projectId" />
            <div class="form-row">
              <div class="form-group">
                <input
                  type="text"
                  id="projectName"
                  required
                  placeholder="类别名称"
                />
              </div>
              <div class="form-group">
                <input type="text" id="projectBrand" placeholder="品牌" />
              </div>
            </div>
            <div class="form-group">
              <textarea
                id="projectDescription"
                placeholder="类别描述（可选）"
                rows="2"
              ></textarea>
            </div>
            <div class="form-group">
              <div class="vis-pill" id="projectProcCapsule">
                <button
                  class="vis-pill-btn active"
                  data-value="非集采"
                  type="button"
                >
                  非集采
                </button>
                <button class="vis-pill-btn" data-value="集采" type="button">
                  集采
                </button>
              </div>
            </div>
            <div class="form-row" id="procTimeRow" style="display: none">
              <div class="form-group">
                <div class="select-group">
                  <input
                    type="text"
                    id="procStartYear"
                    placeholder="开始年"
                    maxlength="4"
                    class="proj-select"
                    style="width: 80px"
                  />
                  <select id="procStartMonth">
                    <option value="">月</option>
                  </select>
                </div>
              </div>
              <div class="form-group">
                <div class="select-group">
                  <input
                    type="text"
                    id="procEndYear"
                    placeholder="结束年"
                    maxlength="4"
                    class="proj-select"
                    style="width: 80px"
                  />
                  <select id="procEndMonth">
                    <option value="">月</option>
                  </select>
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              id="cancelProjectBtn"
              class="btn btn-secondary"
            >
              取消
            </button>
            <button type="submit" class="btn btn-primary">保存</button>
          </div>
        </form>
      </div>
    </div>

    <div class="modal-overlay" id="sampleModal">
      <div class="modal" style="max-width: 520px">
        <div class="modal-header">
          <h3 id="sampleModalTitle">录入样板</h3>
          <button class="modal-close">&times;</button>
        </div>
        <form id="sampleForm">
          <div class="modal-body">
            <input type="hidden" id="sampleId" />
            <div class="sample-img-area" id="imageUploadArea">
              <input
                type="file"
                id="sampleImageInput"
                accept="image/*"
                capture="environment"
                hidden
              />
              <div class="sample-img-placeholder" id="imagePlaceholder">
                <div class="upl-icon">
                  <img
                    src="src/icon/camera.svg"
                    alt="拍照"
                    class="upl-icon-svg"
                  />
                </div>
                <div class="upl-text">点击拍照或上传图片</div>
                <div class="upl-hint">手机端呼出相机 · 电脑端上传文件</div>
              </div>
              <div class="image-preview" id="imagePreview">
                <img id="sampleImagePreview" src="" />
              </div>
            </div>
            <div class="sample-form-grid">
              <div class="form-group">
                <div class="input-group">
                  <input
                    type="text"
                    id="sampleBrand"
                    placeholder="品牌 · 如：水墨江南"
                  />
                </div>
              </div>
              <div class="form-group">
                <div class="input-group">
                  <input
                    type="text"
                    id="sampleName"
                    required
                    placeholder="样板名称 · 如：米黄洞石"
                  />
                </div>
              </div>
              <div class="form-group">
                <div class="input-group">
                  <input
                    type="text"
                    id="sampleModel"
                    placeholder="型号 · 如：MHY-001"
                  />
                </div>
              </div>
              <div class="form-group">
                <div class="input-group" style="gap: 2px; flex-wrap: nowrap">
                  <input
                    type="text"
                    id="sampleCodeSeq"
                    maxlength="4"
                    placeholder="0001"
                    style="width: 56px; text-align: center; flex: none"
                  />
                  <span
                    id="sampleCodeSuffix"
                    style="
                      font-size: 0.85rem;
                      color: var(--text-secondary);
                      padding: 0 8px;
                      line-height: 36px;
                      font-family: monospace;
                    "
                  ></span>
                </div>
              </div>
            </div>
            <div class="procurement-range-capsule" id="procurementRangeCapsule">
              <div class="vis-pill">
                <button class="vis-pill-btn" data-value="范围内" type="button">
                  范围内
                </button>
                <button
                  class="vis-pill-btn active"
                  data-value="范围外"
                  type="button"
                >
                  范围外
                </button>
              </div>
            </div>
            <div
              id="sampleEditFields"
              style="
                display: none;
                margin-top: 12px;
                border-top: 1px solid var(--border);
                padding-top: 12px;
              "
            >
              <div class="form-row">
                <div class="form-group">
                  <div class="input-group">
                    <input
                      type="text"
                      id="sampleSpecs"
                      placeholder="规格 · 如：600x600x20mm"
                    />
                  </div>
                </div>
                <div class="form-group">
                  <div class="input-group">
                    <input
                      type="text"
                      id="sampleColor"
                      placeholder="颜色 · 如：米黄色"
                    />
                  </div>
                </div>
              </div>
              <div class="form-row">
                <div class="form-group" style="grid-column: 1/-1">
                  <div class="input-group">
                    <input
                      type="text"
                      id="sampleMaterial"
                      placeholder="材质 · 如：天然大理石"
                    />
                  </div>
                </div>
              </div>
              <div class="form-row">
                <div class="form-group" style="grid-column: 1/-1">
                  <div class="input-group">
                    <textarea
                      id="sampleDescription"
                      placeholder="描述（可选）"
                      rows="2"
                      style="
                        resize: vertical;
                        width: 100%;
                        padding: 8px 10px;
                        border: 1px solid var(--border);
                        border-radius: var(--radius);
                        font-size: 0.82rem;
                        font-family: inherit;
                        background: var(--bg);
                        color: var(--text);
                      "
                    ></textarea>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              id="cancelSampleBtn"
              class="btn btn-secondary"
            >
              取消
            </button>
            <button type="submit" class="btn btn-primary">保存</button>
          </div>
        </form>
      </div>
    </div>

    <div class="modal-overlay" id="labelPreviewModal"></div>

    <!-- 批量打印标签类型选择弹窗 -->
    <div class="modal-overlay" id="labelTypeModal">
      <div class="modal" style="max-width: 380px">
        <div class="modal-header">
          <h3>选择打印标签</h3>
          <button class="modal-close" id="labelTypeModalClose">&times;</button>
        </div>
        <div class="modal-body" style="padding: 20px 24px">
          <div class="label-type-option">
            <label>
              <input type="checkbox" id="labelType1" checked />
              <span>标签 1（标准信息 + 二维码）</span>
            </label>
          </div>
          <div class="label-type-option">
            <label>
              <input type="checkbox" id="labelType2" checked />
              <span>标签 2（竖向编码胶囊）</span>
            </label>
          </div>
          <div class="label-type-option">
            <label>
              <input type="checkbox" id="labelType3" checked />
              <span>标签 3（旋转二维码 + 型号编号）</span>
            </label>
          </div>
        </div>
        <div
          class="modal-footer"
          style="
            padding: 0 24px 20px;
            display: flex;
            gap: 8px;
            justify-content: flex-end;
          "
        >
          <button class="btn btn-secondary" id="labelTypeCancel">取消</button>
          <button class="btn btn-primary" id="labelTypeConfirm">
            确认打印
          </button>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="cropModal">
      <div class="crop-modal">
        <div class="crop-header">
          <button
            id="cropDiscardBtn"
            class="crop-header-btn discard"
            title="取消并重拍"
          >
            &times;
          </button>
          <button
            id="cropApplyBtn"
            class="crop-header-btn apply"
            title="应用裁切"
          >
            &#10003;
          </button>
        </div>
        <div class="crop-body" id="cropBody">
          <div class="crop-stage" id="cropStage">
            <canvas id="cropImageCanvas"></canvas>
            <div class="crop-overlay" id="cropOverlay">
              <div class="crop-selector" id="cropSelector">
                <div class="crop-handle crop-handle-nw"></div>
                <div class="crop-handle crop-handle-ne"></div>
                <div class="crop-handle crop-handle-sw"></div>
                <div class="crop-handle crop-handle-se"></div>
                <div class="crop-handle crop-handle-n"></div>
                <div class="crop-handle crop-handle-s"></div>
                <div class="crop-handle crop-handle-w"></div>
                <div class="crop-handle crop-handle-e"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 删除确认弹窗 -->
    <div class="modal-overlay" id="deleteConfirmModal">
      <div class="modal" style="max-width: 400px">
        <div class="modal-header">
          <h3>确认删除</h3>
          <button class="modal-close">&times;</button>
        </div>
        <div class="modal-body">
          <p
            id="deleteConfirmInfo"
            style="
              margin-bottom: 12px;
              font-size: 0.85rem;
              color: var(--text-secondary);
            "
          ></p>
          <div class="form-group">
            <input
              type="password"
              id="deletePasswordInput"
              placeholder="请输入登录密码确认"
              style="width: 100%"
            />
          </div>
          <div
            id="deletePasswordError"
            style="
              color: var(--danger);
              font-size: 0.78rem;
              display: none;
              margin-top: 4px;
            "
          >
            密码错误，删除已取消
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" id="cancelDeleteBtn" class="btn btn-secondary">
            取消
          </button>
          <button
            type="button"
            id="confirmDeleteBtn"
            class="btn btn-primary"
            style="background: var(--danger)"
          >
            确认删除
          </button>
        </div>
      </div>
    </div>

    <!-- 详情弹窗 -->
    <div class="modal-overlay" id="detailModal">
      <div class="modal" style="max-width: 560px">
        <div class="modal-header">
          <h3 id="detailModalTitle">详情</h3>
          <button class="modal-close">&times;</button>
        </div>
        <div class="modal-body" id="detailModalBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary modal-close">
            关闭
          </button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <script src="src/js/sidebar.js"></script>
    <script src="src/js/app.js?v=5"></script>
  </body>
</html>
