<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>材料样板管理系统</title>
    <link rel="icon" type="image/jpeg" href="src/icon/logo.jpg" />
    <link rel="stylesheet" href="src/css/style.css?v=17" />
    <link rel="stylesheet" href="src/css/sidebar.css?v=29" />
    <link rel="stylesheet" href="src/css/dashboard.css?v=108" />
    <link rel="stylesheet" href="src/css/easycod.css" />
    <link
      rel="stylesheet"
      href="src/icon/phosphor-icons.css"
      media="print"
      onload="this.media = 'all'"
    />
  </head>
  <body>
    <div id="toastContainer" class="toast-container"></div>

    <!-- ===== 全局加载遮罩 (用于退出登录等场景) ===== -->
    <div id="globalLoading" class="global-loading">
      <div class="global-loading-backdrop"></div>
      <div class="global-loading-content">
        <div class="spinner"></div>
        <span>退出中...</span>
      </div>
    </div>

    <!-- ===== LOGIN ===== -->
    <div id="loginSection" class="page-section active">
      <div class="login-page">
        <div class="login-card">
          <h1>EeaySamplistCod</h1>
          <form id="loginForm">
            <div class="form-group">
              <input
                type="email"
                id="loginEmail"
                placeholder="Email"
                autocomplete="email"
              />
            </div>
            <div class="form-group">
              <input
                type="password"
                id="loginPassword"
                placeholder="Password"
                autocomplete="current-password"
              />
            </div>
            <button type="submit" class="btn btn-primary btn-block">
              Login
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- ===== APP (main application) ===== -->
    <div id="appSection" class="page-section">
      <main class="main-content">
        <div class="container">
          <!-- ===== 标签打印 (Labels) ===== -->
          <div id="labelsSection" class="page-section">
            <div class="print-toolbar">
              <div>
                <button class="back-btn" id="backFromLabels">← 返回</button>
                <h2 style="font-size: 1.1rem; margin-top: 8px">标签打印</h2>
              </div>
              <button class="btn btn-primary" onclick="window.print()">
                打印全部标签
              </button>
            </div>
            <div id="labelsContainer" class="print-labels-container"></div>
          </div>

          <!-- ===== 样板详情 (Sample Detail) ===== -->
          <div id="sampleDetailSection" class="page-section">
            <div class="detail-tab-header">
              <div class="section-header">
                <button class="back-btn" id="backFromDetail">← 返回</button>
              </div>
            </div>
            <div id="sampleDetailContainer"></div>
          </div>

          <div id="ordersSection" class="page-section">
            <div class="section-header">
              <h2>订单管理</h2>
              <button id="refreshOrdersBtn" class="toolbar-btn btn-secondary">
                ⟳ 刷新
              </button>
            </div>
            <div class="table-filters">
              <input
                type="text"
                id="orderSearchInput"
                placeholder="订单号"
                autocomplete="off"
                class="toolbar-input"
                style="width: 100px"
              />
              <select
                id="orderStatusFilter"
                class="toolbar-select"
                style="width: 100px"
              >
                <option value="">全部状态</option>
                <option value="未提交">未提交</option>
                <option value="已收录">已收录</option>
              </select>
              <input
                type="date"
                id="orderDateStart"
                class="toolbar-date"
                style="width: 100px"
              />
              <input
                type="date"
                id="orderDateEnd"
                class="toolbar-date"
                style="width: 100px"
              />
              <button id="orderQueryBtn" class="toolbar-btn btn-secondary">
                查询
              </button>
              <span style="flex: 1"></span>
              <button id="createOrderBtn" class="toolbar-btn btn-primary">
                + 录入
              </button>
              <button id="selectAllOrders" class="toolbar-btn btn-secondary">
                全选
              </button>
              <button id="batchDeleteOrdersBtn" class="toolbar-btn btn-danger">
                批量删除
              </button>
            </div>
            <div id="ordersContainer"></div>
          </div>

          <div id="applySection" class="page-section">
            <div class="section-header">
              <h2>申请管理</h2>
              <button id="refreshApplyBtn" class="toolbar-btn btn-secondary">
                ⟳ 刷新
              </button>
            </div>
            <div class="table-filters">
              <input
                type="text"
                id="applySearchInput"
                placeholder="申请人"
                autocomplete="off"
                class="toolbar-input"
                style="width: 100px"
              />
              <select
                id="applyTypeFilter"
                class="toolbar-select"
                style="width: 100px"
              >
                <option value="">全部事由</option>
                <option value="运输">运输</option>
                <option value="参观">参观</option>
                <option value="选样">选样</option>
                <option value="借还">借还</option>
                <option value="其他">其他</option>
              </select>
              <select
                id="applyStatusFilter"
                class="toolbar-select"
                style="width: 100px"
              >
                <option value="">全部状态</option>
                <option value="待审核">待审核</option>
                <option value="已收录">已收录</option>
              </select>
              <input
                type="date"
                id="applyDateStart"
                class="toolbar-date"
                style="width: 100px"
              />
              <input
                type="date"
                id="applyDateEnd"
                class="toolbar-date"
                style="width: 100px"
              />
              <button id="applyQueryBtn" class="toolbar-btn btn-secondary">
                查询
              </button>
              <span style="flex: 1"></span>
              <button id="createApplyBtn" class="toolbar-btn btn-primary">
                + 录入
              </button>
              <button id="selectAllApply" class="toolbar-btn btn-secondary">
                全选
              </button>
              <button id="batchDeleteApplyBtn" class="toolbar-btn btn-danger">
                批量删除
              </button>
            </div>
            <div id="applyContainer"></div>
          </div>

          <!-- ===== 打卡管理 (Clock) ===== -->
          <div id="clockSection" class="page-section">
            <div class="section-header">
              <h2>打卡管理</h2>
              <button id="refreshClockBtn" class="toolbar-btn btn-secondary">
                ⟳ 刷新
              </button>
            </div>
            <div class="table-filters">
              <input
                type="text"
                id="clockSearchInput"
                placeholder="姓名"
                autocomplete="off"
                class="toolbar-input"
                style="width: 100px"
              />
              <select
                id="clockCompanyTypeFilter"
                class="toolbar-select"
                style="width: 100px"
              >
                <option value="">全部类型</option>
                <option value="业主方">业主方</option>
                <option value="运营方">运营方</option>
                <option value="品牌方">品牌方</option>
                <option value="其他">其他</option>
              </select>
              <input
                type="date"
                id="clockDateStart"
                class="toolbar-date"
                style="width: 100px"
              />
              <input
                type="date"
                id="clockDateEnd"
                class="toolbar-date"
                style="width: 100px"
              />
              <button id="clockQueryBtn" class="toolbar-btn btn-secondary">
                查询
              </button>
              <span style="flex: 1"></span>
              <button id="createClockBtn" class="toolbar-btn btn-primary">
                + 录入
              </button>
              <button id="selectAllClock" class="toolbar-btn btn-secondary">
                全选
              </button>
              <button id="batchDeleteClockBtn" class="toolbar-btn btn-danger">
                批量删除
              </button>
            </div>
            <div id="clockContainer"></div>
          </div>

          <!-- 审批人管理 -->
          <div id="approvalUsersSection" class="page-section">
            <div class="section-header">
              <h2>审批人管理</h2>
              <button
                id="refreshApprovalUsersBtn"
                class="toolbar-btn btn-secondary"
              >
                ⟳ 刷新
              </button>
            </div>
            <div style="margin-bottom: 12px">
              <button id="addApprovalUserBtn" class="toolbar-btn btn-primary">
                + 添加审批人
              </button>
            </div>
            <div id="approvalUsersContainer"></div>
          </div>

          <!-- 流程编辑 -->
          <!-- ===== 流程编辑 (Workflow) ===== -->
          <div id="workflowSection" class="page-section">
            <div class="section-header">
              <h2>流程编辑</h2>
              <button
                id="refreshWorkflowsBtn"
                class="toolbar-btn btn-secondary"
              >
                ⟳ 刷新
              </button>
            </div>
            <div id="workflowContainer"></div>
          </div>

          <!-- 审批记录 -->
          <div id="approvalRecordsSection" class="page-section">
            <div class="section-header">
              <h2>审批记录</h2>
              <button
                id="refreshApprovalRecordsBtn"
                class="toolbar-btn btn-secondary"
              >
                ⟳ 刷新
              </button>
            </div>
            <div id="approvalRecordsContainer"></div>
          </div>

          <!-- 语音助手管理 - 依维五库 -->
          <!-- ===== 语音助手 (Voice Assistant) ===== -->
          <div id="voiceAssistantSection" class="page-section">
            <div class="section-header">
              <h2>语音助手 · 依维（Evi）</h2>
            </div>
            <div
              class="table-filters"
              style="gap: 4px; margin-bottom: 16px; flex-wrap: wrap"
            >
              <button
                id="vaTabKnowledge"
                class="toolbar-btn btn-primary"
                style="border-radius: 3px"
              >
                📚 知识库
              </button>
              <button
                id="vaTabPersonality"
                class="toolbar-btn btn-secondary"
                style="border-radius: 3px"
              >
                🪪 人格库(E)
              </button>
              <button
                id="vaTabBehavior"
                class="toolbar-btn btn-secondary"
                style="border-radius: 3px"
              >
                🛡️ 行为库(E)
              </button>
              <button
                id="vaTabVerification"
                class="toolbar-btn btn-secondary"
                style="border-radius: 3px"
              >
                🔍 核验层(E)
              </button>
              <button
                id="vaTabPrecipRules"
                class="toolbar-btn btn-secondary"
                style="border-radius: 3px"
              >
                📐 沉淀规则(E)
              </button>
              <button
                id="vaTabMemory"
                class="toolbar-btn btn-secondary"
                style="border-radius: 3px"
              >
                🧠 记忆库
              </button>
              <button
                id="vaTabErrors"
                class="toolbar-btn btn-secondary"
                style="border-radius: 3px"
              >
                ❌ 错误库
              </button>
              <button
                id="vaTabEmotion"
                class="toolbar-btn btn-secondary"
                style="border-radius: 3px"
              >
                💗 情感趋势
              </button>
              <button
                id="vaTabLogs"
                class="toolbar-btn btn-secondary"
                style="border-radius: 3px"
              >
                📋 对话日志
              </button>
              <button
                id="vaTabFunctions"
                class="toolbar-btn btn-secondary"
                style="border-radius: 3px"
              >
                ⚙️ 函数技能(E)
              </button>
              <button
                id="vaTabInstincts"
                class="toolbar-btn btn-secondary"
                style="border-radius: 3px"
              >
                ⚡ 本能库(E)
              </button>
              <span style="flex: 1"></span>
              <button
                id="vaDailySummary"
                class="toolbar-btn btn-secondary"
                style="border-radius: 3px"
              >
                🌅 每日沉淀
              </button>
              <button id="vaRefreshBtn" class="toolbar-btn btn-secondary">
                ⟳ 刷新
              </button>
            </div>
            <div id="vaKnowledgeContainer"></div>
            <div id="vaPersonalityContainer" style="display: none"></div>
            <div id="vaBehaviorContainer" style="display: none"></div>
            <div id="vaVerificationContainer" style="display: none"></div>
            <div id="vaPrecipRulesContainer" style="display: none"></div>
            <div id="vaMemoryContainer" style="display: none"></div>
            <div id="vaErrorsContainer" style="display: none"></div>
            <div id="vaEmotionContainer" style="display: none"></div>
            <div id="vaLogsContainer" style="display: none"></div>
            <div id="vaFunctionsContainer" style="display: none"></div>
            <div id="vaInstinctsContainer" style="display: none"></div>
          </div>
        </div>
      </main>
    </div>

    <!-- 删除确认弹窗 -->
    <div class="modal-overlay" id="deleteConfirmModal">
      <div class="modal" style="max-width: 400px">
        <div class="modal-header">
          <h3>确认删除</h3>
          <button class="modal-close">&times;</button>
        </div>
        <div class="modal-body">
          <p
            id="deleteConfirmInfo"
            style="
              margin-bottom: 12px;
              font-size: 0.85rem;
              color: var(--text-secondary);
            "
          ></p>
          <div class="form-group">
            <input
              type="password"
              id="deletePasswordInput"
              placeholder="请输入登录密码确认"
              style="width: 100%"
            />
          </div>
          <div
            id="deletePasswordError"
            style="
              color: var(--danger);
              font-size: 0.78rem;
              display: none;
              margin-top: 4px;
            "
          >
            密码错误，删除已取消
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" id="cancelDeleteBtn" class="btn btn-secondary">
            取消
          </button>
          <button
            type="button"
            id="confirmDeleteBtn"
            class="btn btn-primary"
            style="background: var(--danger)"
          >
            确认删除
          </button>
        </div>
      </div>
    </div>

    <!-- 详情弹窗 -->
    <!-- ===== 详情弹窗 ===== -->
    <div class="modal-overlay" id="detailModal">
      <div class="modal" style="max-width: 560px">
        <div class="modal-header">
          <h3 id="detailModalTitle">详情</h3>
          <button class="modal-close">&times;</button>
        </div>
        <div class="modal-body" id="detailModalBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary modal-close">
            关闭
          </button>
        </div>
      </div>
    </div>
  </body>
  <script src="src/lib/supabase.min.js"></script>
  <script src="src/lib/qrcode.min.js"></script>
  <script src="src/js/login.js?v=2"></script>
  <script src="src/js/dashboard.js"></script>
  <script src="src/js/sidebar.js"></script>
  <script src="src/js/app/db-writer.js?v=2"></script>
  <script src="src/js/app/upload-manager.js?v=2"></script>
  <script src="src/js/easycod.js?v=3"></script>
  <script src="src/js/app.js?v=17"></script>
</html>
