<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>样板详情 - 材料样板管理系统</title>
    <link rel="stylesheet" href="src/css/style.css" />
  </head>
  <body>
    <div class="container" style="padding-top: 24px; padding-bottom: 40px">
      <div id="loadingState" class="loading">加载中</div>
      <div id="errorState" class="empty-state" style="display: none">
        <div class="icon">🔍</div>
        <p id="errorMessage">未找到该样板信息</p>
      </div>
      <div id="detailContent" style="display: none">
        <div class="detail-view">
          <div class="detail-header">
            <h2 id="sampleName">-</h2>
            <div id="sampleCode" class="detail-code">-</div>
          </div>
          <div class="detail-divider"></div>
          <div class="detail-body" id="detailBody"></div>
        </div>
      </div>
    </div>
    <script>
      var STORAGE_KEYS = {
        projects: "easycod_projects",
        samples: "easycod_samples",
        session: "easycod_session",
        dailyCode: "easycod_daily_code",
        users: "easycod_users",
        fieldVisibility: "easycod_field_visibility",
      };

      function getStore(key) {
        try {
          return JSON.parse(localStorage.getItem(key));
        } catch (e) {
          return null;
        }
      }

      function getProjects() {
        return getStore(STORAGE_KEYS.projects) || [];
      }
      function getSamples() {
        return getStore(STORAGE_KEYS.samples) || [];
      }

      function getDailyCode() {
        var data = getStore(STORAGE_KEYS.dailyCode);
        var today = new Date().toISOString().split("T")[0];
        if (data && data.date === today) return data.code;
        var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
        var code = "";
        for (var i = 0; i < 6; i++)
          code += chars[Math.floor(Math.random() * chars.length)];
        localStorage.setItem(
          STORAGE_KEYS.dailyCode,
          JSON.stringify({ code: code, date: today }),
        );
        return code;
      }

      function getFieldVisibility() {
        var saved = getStore(STORAGE_KEYS.fieldVisibility) || {};
        var defaults = {
          specs: "\u9080\u8BF7",
          color: "\u9080\u8BF7",
          material: "\u9080\u8BF7",
          description: "\u9080\u8BF7",
          image: "\u9080\u8BF7",
        };
        for (var k in defaults) {
          if (!saved[k]) saved[k] = defaults[k];
        }
        return saved;
      }

      function formatDate(d) {
        if (!d) return "-";
        var dt = new Date(d);
        return (
          dt.getFullYear() +
          "\u5E74" +
          String(dt.getMonth() + 1).padStart(2, "0") +
          "\u6708"
        );
      }

      function esc(s) {
        if (!s) return "-";
        var d = document.createElement("div");
        d.textContent = s;
        return d.innerHTML;
      }

      document.addEventListener("DOMContentLoaded", function () {
        var params = new URLSearchParams(window.location.search);
        var sid = params.get("id");
        var loadingEl = document.getElementById("loadingState");
        var errorEl = document.getElementById("errorState");
        var detailEl = document.getElementById("detailContent");

        if (!sid) {
          loadingEl.style.display = "none";
          errorEl.style.display = "block";
          document.getElementById("errorMessage").textContent =
            "\u7F3A\u5C11\u6837\u677F ID \u53C2\u6570";
          return;
        }

        var samples = getSamples();
        var sample = samples.find(function (s) {
          return s.id === sid;
        });

        if (!sample) {
          loadingEl.style.display = "none";
          errorEl.style.display = "block";
          document.getElementById("errorMessage").textContent =
            "\u672A\u627E\u5230\u8BE5\u6837\u677F\u4FE1\u606F";
          return;
        }

        var projects = getProjects();
        var project = projects.find(function (p) {
          return p.id === sample.projectId;
        });

        loadingEl.style.display = "none";
        detailEl.style.display = "block";

        document.getElementById("sampleName").textContent = sample.name || "-";
        document.getElementById("sampleCode").textContent = sample.code || "-";

        var vis = getFieldVisibility();
        var currentCode = getDailyCode();

        var allFields = [
          {
            key: null,
            label: "\u7C7B\u522B",
            val: project ? project.name : "-",
          },
          { key: null, label: "\u578B\u53F7", val: sample.model || "-" },
          { key: null, label: "品牌", val: sample.brand || "-" },
          { key: "specs", label: "\u89C4\u683C", val: sample.specs || "-" },
          { key: "color", label: "\u989C\u8272", val: sample.color || "-" },
          {
            key: "material",
            label: "\u6750\u8D28",
            val: sample.material || "-",
          },
          {
            key: "description",
            label: "\u63CF\u8FF0",
            val: sample.description || "-",
          },
          {
            key: "image",
            label: "\u56FE\u7247",
            val: sample.imageUrl || null,
            isImage: true,
          },
        ];

        var pub = [];
        var inviteFields = [];

        allFields.forEach(function (f) {
          if (f.key === null) {
            pub.push(f);
            return;
          }
          var state = vis[f.key] || "\u9080\u8BF7";
          if (state === "\u663E\u793A") {
            pub.push(f);
          } else if (state === "\u9080\u8BF7") {
            inviteFields.push(f);
          }
        });

        function renderFields(list) {
          var h = "";
          list.forEach(function (f) {
            if (f.isImage && f.val) {
              h += '<div class="sd-row">';
              h += '<span class="sd-lbl">' + esc(f.label) + "</span>";
              h += '<div class="sd-img-wrap"><img src="' + esc(f.val) + '" class="sd-img"></div>';
              h += "</div>";
            } else {
              h += '<div class="sd-row">';
              h += '<span class="sd-lbl">' + esc(f.label) + "</span>";
              h += '<span class="sd-val">' + esc(f.val) + "</span>";
              h += "</div>";
            }
          });
          return h;
        }

        var hasRestricted = inviteFields.length > 0;

        var body = "";
        var isProc = project && project.procurement;

        body += '<div class="sd-section">';
        body += '<div class="sd-section-title">基础信息</div>';
        body += renderFields(pub);
        body += '<div class="sd-row"><span class="sd-lbl">是否集采</span><span class="sd-val">' + (isProc ? "集采" : "非集采") + "</span></div>";
        if (isProc) {
          body += '<div class="sd-row"><span class="sd-lbl">集采时间</span><span class="sd-val">' + formatDate(project.procurementStart) + " - " + formatDate(project.procurementEnd) + "</span></div>";
        }
        body += '<div class="sd-row"><span class="sd-lbl">范围内外</span><span class="sd-val">' + (isProc ? sample.procurementRange || (sample.procurement ? "范围内" : "范围外") : "范围外") + "</span></div>";
        body += "</div>";

        if (hasRestricted) {
          body += '<div class="sd-invite">';
          body += '<button class="sd-invite-btn" id="invitePrompt">输入邀请码查看详情</button>';
          body += '<div class="sd-invite-form" id="inviteForm">';
          body += '<input type="text" id="inviteInput" placeholder="邀请码" maxlength="6">';
          body += '<button id="inviteSubmit" class="btn btn-primary">验证</button>';
          body += '<div class="sd-invite-error" id="inviteError">邀请码错误</div>';
          body += "</div></div>";

          body += '<div class="sd-section" id="restrictedSection" style="display:none">';
          body += '<div class="sd-section-title">扩展信息</div>';
          body += renderFields(inviteFields);
          body += "</div>";
        }

        document.getElementById("detailBody").innerHTML = body;

        var promptEl = document.getElementById("invitePrompt");
        if (promptEl) {
          promptEl.addEventListener("click", function () {
            promptEl.style.display = "none";
            var form = document.getElementById("inviteForm");
            form.style.display = "flex";
            document.getElementById("inviteInput").focus();
          });
        }

        var subBtn = document.getElementById("inviteSubmit");
        if (subBtn) {
          subBtn.addEventListener("click", function () {
            var inp = document.getElementById("inviteInput").value.trim().toUpperCase();
            var err = document.getElementById("inviteError");
            if (inp === currentCode) {
              err.style.display = "none";
              var rs = document.getElementById("restrictedSection");
              if (rs) rs.style.display = "block";
              document.getElementById("inviteForm").style.display = "none";
            } else {
              err.style.display = "block";
            }
          });
        }

        var inpEl = document.getElementById("inviteInput");
        if (inpEl) {
          inpEl.addEventListener("keydown", function (e) {
            if (e.key === "Enter") document.getElementById("inviteSubmit").click();
          });
        }
      });
    </script>
  </body>
</html>
