<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>样板详情 - 材料样板管理系统</title>
    <link rel="icon" type="image/jpeg" href="src/icon/logo.jpg" />
    <link rel="stylesheet" href="src/css/style.css?v=4" />
  </head>
  <body>
    <div class="container" style="padding-top: 24px; padding-bottom: 40px">
      <div id="loadingState" class="loading">加载中</div>
      <div id="errorState" class="empty-state" style="display: none">
        <div class="icon">🔍</div>
        <p id="errorMessage">未找到该样板信息</p>
      </div>
      <div id="detailContent" style="display: none">
        <div class="detail-view">
          <div class="detail-header">
            <h2 id="sampleName">-</h2>
            <div id="sampleCode" class="detail-code">-</div>
          </div>
          <div class="detail-divider"></div>
          <div class="detail-body" id="detailBody"></div>
          <div id="mpLaunch" style="display:none;padding:16px 0 0 0">
            <a id="mpLaunchBtn" class="btn btn-primary" style="display:block;text-align:center;text-decoration:none;font-size:16px;padding:12px;border-radius:8px;background:linear-gradient(180deg,#FF8A5C,#FF6B35);color:#fff;font-weight:600;">进入小程序查看详情</a>
          </div>
        </div>
      </div>
    </div>
    <script>
      var SUPABASE_URL = "https://vqoortdzgvllyxplduxq.supabase.co";
      var SUPABASE_ANON_KEY = "sb_publishable_arXBSdeuLwK2UkZkTyDfZg_Zmr5yIqI";

      var STORAGE_KEYS = {
        projects: "easycod_projects",
        samples: "easycod_samples",
        session: "easycod_session",
        dailyCode: "easycod_daily_code",
        users: "easycod_users",
        fieldVisibility: "easycod_field_visibility",
      };

      function getStore(key) {
        try {
          return JSON.parse(localStorage.getItem(key));
        } catch (e) {
          return null;
        }
      }

      function getProjects() {
        return getStore(STORAGE_KEYS.projects) || [];
      }
      function getSamples() {
        return getStore(STORAGE_KEYS.samples) || [];
      }

      var _dailyCode = null;
      var _dailyCodePromise = null;

      function getDailyCode() {
        if (_dailyCode) return _dailyCode;
        var data = getStore(STORAGE_KEYS.dailyCode);
        var today = new Date().toISOString().split("T")[0];
        if (data && data.date === today) {
          _dailyCode = data.code;
          return _dailyCode;
        }
        var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
        var code = "";
        for (var i = 0; i < 6; i++)
          code += chars[Math.floor(Math.random() * chars.length)];
        localStorage.setItem(
          STORAGE_KEYS.dailyCode,
          JSON.stringify({ code: code, date: today }),
        );
        _dailyCode = code;
        return code;
      }

      function fetchDailyCodeFromDB(sb) {
        if (_dailyCodePromise) return _dailyCodePromise;
        if (!sb) {
          _dailyCodePromise = Promise.resolve(null);
          return _dailyCodePromise;
        }
        var today = new Date().toISOString().split("T")[0];
        _dailyCodePromise = sb
          .from("daily_codes")
          .select("code")
          .eq("date", today)
          .maybeSingle()
          .then(function (res) {
            if (!res.error && res.data && res.data.code) {
              _dailyCode = res.data.code;
              localStorage.setItem(
                STORAGE_KEYS.dailyCode,
                JSON.stringify({ code: _dailyCode, date: today }),
              );
              return _dailyCode;
            }
            var localCode = getDailyCode();
            sb.from("daily_codes")
              .upsert({ code: localCode, date: today }, { onConflict: "date" })
              .then();
            return localCode;
          })
          .catch(function () {
            return null;
          });
        return _dailyCodePromise;
      }

      function getFieldVisibility() {
        var saved = getStore(STORAGE_KEYS.fieldVisibility) || {};
        var defaults = {
          specs: "\u9080\u8BF7",
          color: "\u9080\u8BF7",
          material: "\u9080\u8BF7",
          description: "\u9080\u8BF7",
          image: "\u9080\u8BF7",
        };
        for (var k in defaults) {
          if (!saved[k]) saved[k] = defaults[k];
        }
        return saved;
      }

      function fromSnakeCase(obj) {
        var r = {};
        for (var k in obj) {
          if (Object.prototype.hasOwnProperty.call(obj, k)) {
            var ck = k.replace(/_([a-z])/g, function (m, c) {
              return c.toUpperCase();
            });
            r[ck] = obj[k];
          }
        }
        return r;
      }

      function extractStoragePath(url) {
        if (!url) return null;
        var parts = url.split("/sample-images/");
        if (parts.length < 2) return null;
        return parts[1].split("?")[0];
      }

      async function refreshSignedUrl(sb, url) {
        if (!url || !sb) return url;
        var path = extractStoragePath(url);
        if (!path) return url;
        try {
          var result = await sb.storage
            .from("sample-images")
            .createSignedUrl(path, 604800);
          return result.data ? result.data.signedUrl : url;
        } catch (e) {
          return url;
        }
      }

      function formatDate(d) {
        if (!d) return "-";
        var dt = new Date(d);
        return (
          dt.getFullYear() +
          "\u5E74" +
          String(dt.getMonth() + 1).padStart(2, "0") +
          "\u6708"
        );
      }

      function esc(s) {
        if (!s) return "-";
        var d = document.createElement("div");
        d.textContent = s;
        return d.innerHTML;
      }

      document.addEventListener("DOMContentLoaded", async function () {
        var params = new URLSearchParams(window.location.search);
        var sid = params.get("id");
        var loadingEl = document.getElementById("loadingState");
        var errorEl = document.getElementById("errorState");
        var detailEl = document.getElementById("detailContent");

        var supabaseClient = null;
        if (
          typeof supabase !== "undefined" &&
          window.SUPABASE_URL &&
          window.SUPABASE_ANON_KEY
        ) {
          supabaseClient = supabase.createClient(
            window.SUPABASE_URL,
            window.SUPABASE_ANON_KEY,
          );
        }

        await fetchDailyCodeFromDB(supabaseClient);

        if (!sid) {
          loadingEl.style.display = "none";
          errorEl.style.display = "block";
          document.getElementById("errorMessage").textContent =
            "缺少样板 ID 参数";
          return;
        }

        var samples = getSamples();
        var sample = samples.find(function (s) {
          return s.id === sid;
        });
        var projects = getProjects();

        function renderSample(sample, projects) {
          var project = projects.find(function (p) {
            return p.id === sample.projectId;
          });

          loadingEl.style.display = "none";
          detailEl.style.display = "block";

          document.getElementById("sampleName").textContent =
            sample.name || "-";
          document.getElementById("sampleCode").textContent =
            sample.code || "-";

          var vis = getFieldVisibility();
          var currentCode = getDailyCode();

          var allFields = [
            {
              key: null,
              label: "类别",
              val: project ? project.name : "-",
            },
            { key: null, label: "型号", val: sample.model || "-" },
            { key: null, label: "品牌", val: sample.brand || "-" },
            {
              key: "specs",
              label: "规格",
              val: sample.specs || "-",
            },
            {
              key: "color",
              label: "颜色",
              val: sample.color || "-",
            },
            {
              key: "material",
              label: "材质",
              val: sample.material || "-",
            },
            {
              key: "description",
              label: "描述",
              val: sample.description || "-",
            },
            {
              key: "image",
              label: "图片",
              val: sample.imageUrl || null,
              isImage: true,
            },
          ];

          var pub = [];
          var inviteFields = [];

          allFields.forEach(function (f) {
            if (f.key === null) {
              pub.push(f);
              return;
            }
            var state = vis[f.key] || "邀请";
            if (state === "显示") {
              pub.push(f);
            } else if (state === "邀请") {
              inviteFields.push(f);
            }
          });

          function renderFields(list) {
            var h = "";
            list.forEach(function (f) {
              if (f.isImage && f.val) {
                h += '<div class="sd-row">';
                h += '<span class="sd-lbl">' + esc(f.label) + "</span>";
                h +=
                  '<div class="sd-img-wrap"><img src="' +
                  esc(f.val) +
                  '" class="sd-img"></div>';
                h += "</div>";
              } else {
                h += '<div class="sd-row">';
                h += '<span class="sd-lbl">' + esc(f.label) + "</span>";
                h += '<span class="sd-val">' + esc(f.val) + "</span>";
                h += "</div>";
              }
            });
            return h;
          }

          var hasRestricted = inviteFields.length > 0;

          var body = "";
          var isProc = project && project.procurement;

          body += '<div class="sd-section">';
          body += '<div class="sd-section-title">基础信息</div>';
          body += renderFields(pub);
          body +=
            '<div class="sd-row"><span class="sd-lbl">是否集采</span><span class="sd-val">' +
            (isProc ? "集采" : "非集采") +
            "</span></div>";
          if (isProc) {
            body +=
              '<div class="sd-row"><span class="sd-lbl">集采时间</span><span class="sd-val">' +
              formatDate(project.procurementStart) +
              " - " +
              formatDate(project.procurementEnd) +
              "</span></div>";
          }
          body +=
            '<div class="sd-row"><span class="sd-lbl">范围内外</span><span class="sd-val">' +
            (isProc
              ? sample.procurementRange ||
                (sample.procurement ? "范围内" : "范围外")
              : "范围外") +
            "</span></div>";
          body += "</div>";

          if (hasRestricted) {
            body += '<div class="sd-invite">';
            body +=
              '<button class="sd-invite-btn" id="invitePrompt">输入邀请码查看详情</button>';
            body += '<div class="sd-invite-form" id="inviteForm">';
            body +=
              '<input type="text" id="inviteInput" placeholder="邀请码" maxlength="6">';
            body +=
              '<button id="inviteSubmit" class="btn btn-primary">验证</button>';
            body +=
              '<div class="sd-invite-error" id="inviteError">邀请码错误</div>';
            body += "</div></div>";

            body +=
              '<div class="sd-section" id="restrictedSection" style="display:none">';
            body += '<div class="sd-section-title">扩展信息</div>';
            body += renderFields(inviteFields);
            body += "</div>";
          }

          document.getElementById("detailBody").innerHTML = body;

          var promptEl = document.getElementById("invitePrompt");
          if (promptEl) {
            promptEl.addEventListener("click", function () {
              promptEl.style.display = "none";
              var form = document.getElementById("inviteForm");
              form.style.display = "flex";
              document.getElementById("inviteInput").focus();
            });
          }

          var subBtn = document.getElementById("inviteSubmit");
          if (subBtn) {
            subBtn.addEventListener("click", function () {
              var inp = document
                .getElementById("inviteInput")
                .value.trim()
                .toUpperCase();
              var err = document.getElementById("inviteError");
              if (inp === currentCode) {
                err.style.display = "none";
                var rs = document.getElementById("restrictedSection");
                if (rs) rs.style.display = "block";
                document.getElementById("inviteForm").style.display = "none";
              } else {
                err.style.display = "block";
              }
            });
          }

          var inpEl = document.getElementById("inviteInput");
          if (inpEl) {
            inpEl.addEventListener("keydown", function (e) {
              if (e.key === "Enter")
                document.getElementById("inviteSubmit").click();
            });
          }
        }

        function loadMpLaunchBtn() {
          if (!supabaseClient) return;
          supabaseClient
            .from("settings")
            .select("value")
            .eq("key", "miniprogramScheme")
            .maybeSingle()
            .then(function (res) {
              if (
                !res.error &&
                res.data &&
                res.data.value &&
                res.data.value.openlink
              ) {
                var container = document.getElementById("mpLaunch");
                var btn = document.getElementById("mpLaunchBtn");
                btn.href = res.data.value.openlink;
                container.style.display = "block";
              }
            })
            .catch(function () {});
        }

        if (sample) {
          if (
            supabaseClient &&
            sample.imageUrl &&
            sample.imageUrl.includes("/object/sign/")
          ) {
            sample.imageUrl = await refreshSignedUrl(
              supabaseClient,
              sample.imageUrl,
            );
            if (sample.thumbnailUrl) {
              sample.thumbnailUrl = await refreshSignedUrl(
                supabaseClient,
                sample.thumbnailUrl,
              );
            }
          }
          renderSample(sample, projects);
          loadMpLaunchBtn();
        } else if (supabaseClient) {
          supabaseClient
            .from("samples")
            .select("*")
            .eq("id", sid)
            .maybeSingle()
            .then(async function (res) {
              if (res.error || !res.data) {
                loadingEl.style.display = "none";
                errorEl.style.display = "block";
                document.getElementById("errorMessage").textContent =
                  "未找到该样板信息";
                return;
              }
              var s = fromSnakeCase(res.data);
              if (s.imageUrl) {
                s.imageUrl = await refreshSignedUrl(supabaseClient, s.imageUrl);
              }
              if (s.thumbnailUrl) {
                s.thumbnailUrl = await refreshSignedUrl(
                  supabaseClient,
                  s.thumbnailUrl,
                );
              }
              supabaseClient
                .from("projects")
                .select("*")
                .eq("id", s.projectId)
                .maybeSingle()
                .then(function (pres) {
                  var ps = [];
                  if (!pres.error && pres.data) {
                    ps = [fromSnakeCase(pres.data)];
                  }
                  renderSample(s, ps);
                  loadMpLaunchBtn();
                });
            })
            .catch(function () {
              loadingEl.style.display = "none";
              errorEl.style.display = "block";
              document.getElementById("errorMessage").textContent =
                "未找到该样板信息";
            });
        } else {
          loadingEl.style.display = "none";
          errorEl.style.display = "block";
          document.getElementById("errorMessage").textContent =
            "未找到该样板信息";
        }
      });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  </body>
</html>
